name: Frontend PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check tokens
        run: npm run tokens:check
      - name: Check design specification
        run: npm run design:lint
      - name: Playwright
        run: npx playwright test --workers=1
      - name: Integração local (API interceptada)
        run: npm run test:local-api -- --workers=1
      - name: Capturas Chromium — modo demonstração
        if: success() || failure()
        run: npm run test:visual:demo -- --workers=1
      - name: Capturas Chromium — modo API simulada
        if: success() || failure()
        run: npm run test:visual:api -- --workers=1
      - name: Gerar galeria visual
        if: always()
        run: npm run visual:report
      - name: Publicar prints das telas
        id: visual-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisao-visual-chromium-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Link da galeria no resumo da execução
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.visual-artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            echo "[Abrir prints da revisão visual]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
